# ==============================================================================
# PAST DARG'OM TUMANI 65-SONLI UMUMTA'LIM MAKTABI - DECAP CMS CONFIGURATION
# Bosh Ega (Owner) va Boshqaruv Markazi (Admin) backoffice paneli
# ==============================================================================

backend:
  name: git-gateway
  branch: main

# Maktabdagi rasm va PDF fayllar saqlanadigan joy
media_folder: "public/uploads"
public_folder: "/uploads"

# Panel tili
locale: 'uz'

# Bosh Ega (Owner) & Adminlik huquqlari
ROLES:
  - name: "owner"
    label: "Bosh Ega (Super Admin / Direktor)"
    description: "Barcha sozlamalar, yo'nalishlar, dars jadvallari, kutubxona, barcha huquqlar"
    permissions:
      - "manage_users"
      - "edit_settings"
      - "publish_all"
  - name: "editor"
    label: "Maktab Mas'uli (O'qituvchi / Muharrir)"
    description: "To'garaklar, yangiliklar va dars jadvalini kiritish hamda tahrirlash"

collections:
  # 1. TO'GARAKLAR RO'YXATI (CRUD)
  - name: "togaraklar"
    label: "To'garaklar Ro'yxati"
    label_singular: "To'garak"
    folder: "content/togaraklar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "To'garak nomi", name: "title", widget: "string" }
      - { label: "Kategoriya", name: "category", widget: "select", options: ["Yo'nalishlar", "STEM", "Sport", "San'at"] }
      - { label: "To'garak raxbari (O'qituvchi)", name: "teacher", widget: "string" }
      - { label: "O'qituvchi unvoni/toifasi", name: "teacherRole", widget: "string" }
      - { label: "Rasm manzili", name: "teacherPhoto", widget: "image", required: false }
      - { label: "Dars kunlari va vaqti", name: "schedule", widget: "string", hint: "Masalan: Dushanba, Chorshanba 14:00" }
      - { label: "Xona / Xona numeri", name: "room", widget: "string" }
      - { label: "Ajratilgan o'rinlar soni", name: "seats", widget: "number" }
      - { label: "To'garak haqida qisqacha mazmun", name: "body", widget: "markdown" }
      - { label: "Aktivlik (Status)", name: "badge", widget: "string", default: "Mavjud" }

  # 2. YANGILIKLAR VA MAQOLALAR TIZIMI (NEWS & ARTICLES)
  - name: "yangiliklar"
    label: "Yangiliklar va Maqolalar"
    label_singular: "Yangilik"
    folder: "content/yangiliklar"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Maqola sarlavhasi", name: "title", widget: "string" }
      - { label: "Chop etilgan vaqti", name: "date", widget: "datetime" }
      - { label: "Kategoriya", name: "category", widget: "select", options: ["Maktab hayoti", "Tadbirlar", "Yutuqlar", "E'lonlar"] }
      - { label: "Muallif / Raxbar", name: "author", widget: "string", default: "65-Maktab Ma'muriyati" }
      - { label: "Aosiy rasm", name: "image", widget: "image" }
      - { label: "Qisqacha mazmuni", name: "excerpt", widget: "text" }
      - { label: "To'liq maqola matni", name: "body", widget: "markdown" }
      - { label: "Rasm ostidagi matn (Asosiy sahifada ko'rinish)", name: "featured", widget: "boolean", default: false }

  # 3. ELEKTRON KUTUBXONA (GOOGLE DRIVE PDF)
  - name: "kutubxona"
    label: "Elektron Kutubxona (PDF)"
    label_singular: "Kitob"
    folder: "content/kutubxona"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Kitob / Darslik nomi", name: "title", widget: "string" }
      - { label: "Fan", name: "subject", widget: "string" }
      - { label: "Sinf", name: "grade", widget: "number", value_type: "int", min: 1, max: 11 }
      - { label: "Muallif(lar)", name: "author", widget: "string" }
      - { label: "Chop etilgan yili", name: "year", widget: "number", value_type: "int" }
      - { label: "Google Drive PDF ilovasi (URL)", name: "fileUrl", widget: "string" }
      - { label: "Fayl hajmi", name: "fileSize", widget: "string", default: "15 MB" }
      - { label: "Tili/Tillar soni", name: "pages", widget: "number", value_type: "int" }
      - { label: "Kitob muqovasi rasmi", name: "cover", widget: "image", required: false }
      - { label: "Qisqacha tavsif", name: "description", widget: "text" }

  # 4. DARS JADVALI (1 - 11-SINF)
  - name: "jadval"
    label: "Dars Jadvali"
    label_singular: "Sinf jadvali"
    folder: "content/jadval"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Sinf nomi", name: "className", widget: "string", hint: "Masalan: 10-'A'" }
      - { label: "Smena", name: "shift", widget: "select", options: ["1-Smena", "2-Smena"] }
      - { label: "Sinf rahbari", name: "classMaster", widget: "string" }
      - { label: "Haftalik darslar", name: "days", widget: "list", fields: [
          { label: "Hafta kuni", name: "dayName", widget: "select", options: ["Dushanba", "Seshanba", "Chorshanba", "Payshanba", "Juma", "Shanba"] },
          { label: "Darslar ro'yxati", name: "lessons", widget: "list", fields: [
              { label: "Soat", name: "lessonNumber", widget: "number", value_type: "int" },
              { label: "Fan", name: "subject", widget: "string" },
              { label: "O'qituvchi", name: "teacher", widget: "string" },
              { label: "Xona", name: "room", widget: "string" }
          ]}
      ]}

  # 5. O'QUVCHILAR TIZIMI (REATING)
  - name: "reyting"
    label: "O'quvchilar Reytingi"
    label_singular: "Reyting a'zosi"
    folder: "content/reyting"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "O'quvchi ismi-sharifi", name: "name", widget: "string" }
      - { label: "Sinf", name: "grade", widget: "string" }
      - { label: "O'rtacha ball", name: "score", widget: "number", value_type: "float" }
      - { label: "Erishgan yutug'i", name: "achievement", widget: "string" }
      - { label: "Rasm", name: "image", widget: "image" }

  # 6. PEDAGOGLAR (O'QITUVCHILAR TARKIBI)
  - name: "oqituvchilar"
    label: "O'qituvchilar Tarkibi"
    label_singular: "O'qituvchi"
    folder: "content/oqituvchilar"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "I.O' .S.", name: "name", widget: "string" }
      - { label: "Mutaxassislik fani", name: "subject", widget: "string" }
      - { label: "Lavozimi / Toifasi", name: "rank", widget: "string" }
      - { label: "Pedagogik staji (yil)", name: "experience", widget: "number", value_type: "int" }
      - { label: "Rasm", name: "photo", widget: "image" }
      - { label: "Erishgan yutuqlari va mukofotlari", name: "achievements", widget: "string" }

  # 7. MAKTAB SOZLAMALARI VA BOSHQA MA'LUMOTLAR
  - name: "sozlamalar"
    label: "Maktab Sozlamalari"
    files:
      - label: "Maktab bosh ma'lumotlari"
        name: "general_info"
        file: "content/settings/general.json"
        fields:
          - { label: "Maktab to'liq nomi", name: "school_name", widget: "string" }
          - { label: "Shior", name: "motto", widget: "string" }
          - { label: "Maktab manzili", name: "address", widget: "string" }
          - { label: "E-pochta", name: "display_email", widget: "string" }
          - { label: "Bog'lanish telefon raqami", name: "phone", widget: "string" }
          - { label: "Telegram bot havolasi", name: "telegram_bot", widget: "string" }
          - { label: "Ish vaqti", name: "working_hours", widget: "string" }
